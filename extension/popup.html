<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scent Price Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <form id="f">
    <div class="head">
      <div class="brand" data-i18n="appName"></div>
      <div class="langSwitch" id="langSwitch"></div>
    </div>
    <input id="b" type="search" data-i18n-ph="popup.brandPh" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <input id="q" type="search" data-i18n-ph="popup.placeholder" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      <button type="submit" data-i18n="popup.search"></button>
    </div>
    <div id="recent"></div>
    <button type="button" id="open" class="link" data-i18n="popup.open"></button>
  </form>
  <script src="popup.js" type="module"></script>
</body>
</html>
