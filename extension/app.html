<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scent Price Finder</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="topRow">
        <h1><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="12.5" y="2.5" width="7" height="7" rx="1.2"/><rect x="14" y="9" width="4" height="3"/><path d="M8 13.5c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2V27c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2z" class="glass"/><path d="M9.6 20h12.8v6.4c0 .6-.5 1-1 1H10.6c-.6 0-1-.4-1-1z" class="juice"/></svg><span data-i18n="appName"></span></h1>
        <div class="langSwitch" id="langSwitch"></div>
        <button type="button" id="openHistory" class="iconBtn" data-i18n-title="hist.title" aria-controls="history" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><span data-i18n="hist.button"></span></button>
        <button type="button" id="openSettings" class="iconBtn" data-i18n-title="settings.title" aria-controls="settings" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span data-i18n="settings.title"></span></button>
      </div>
      <form id="searchForm" class="search">
        <input id="qBrand" class="qBrand" type="search" data-i18n-ph="search.brandPh" data-i18n-title="search.brandTitle" autocomplete="off" autocapitalize="off" spellcheck="false">
        <input id="qName" class="qName" type="search" data-i18n-ph="search.namePh" data-i18n-title="search.nameTitle" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit" id="go" data-i18n="search.button"></button>
      </form>
      <p id="qNote" class="qNote" aria-live="polite"></p>
      <div id="progress" class="progress" role="status" aria-live="polite" hidden></div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <div class="chips" id="catChips"></div>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="optSoldout"><span data-i18n="opt.soldout"></span></label>
        <label class="chip"><input type="checkbox" id="optLoose"><span data-i18n="opt.loose"></span></label>
      </div>
      <div class="selects">
        <label><span data-i18n="sort.label"></span>
          <select id="sort">
            <option value="krw" data-i18n="sort.krw"></option>
            <option value="perml" data-i18n="sort.perml"></option>
            <option value="store" data-i18n="sort.store"></option>
          </select>
        </label>
        <label><span data-i18n="size.label"></span>
          <select id="size"></select>
        </label>
        <label><span data-i18n="conc.label"></span>
          <select id="conc"></select>
        </label>
        <label><span data-i18n="cur.label"></span>
          <select id="dispCur"></select>
        </label>
      </div>
    </section>

    <div id="access" class="access" role="alert" hidden></div>
    <div id="best" class="best" hidden></div>
    <details id="statusBox" class="statusBox" hidden>
      <summary id="statusSum"></summary>
      <div id="status" class="status"></div>
    </details>
    <div id="results" class="results"></div>
    <p id="empty" class="emptyMsg" hidden></p>
    <section id="recentBox" class="recentBox" hidden>
      <div class="recentHead"><h2 data-i18n="hist.recent"></h2><button type="button" id="recentAll" class="link" data-i18n="hist.all"></button></div>
      <div id="recentQuick" class="recentQuick"></div>
    </section>
    <p id="hiddenNote" class="hiddenNote" hidden></p>
  </main>

  <div id="sheetScrim" class="scrim" hidden></div>
  <aside id="settings" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheetHead">
      <h2 id="settingsTitle" data-i18n="settings.title"></h2>
      <button type="button" class="sheetClose" data-i18n="settings.done"></button>
    </div>
    <div class="sheetBody">
    <details class="panel" id="storePanel">
      <summary><span class="sumTitle" data-i18n="stores.title"></span> <span id="storeCount"></span></summary>
      <div id="storeGroups"></div>
      <div class="addStore">
        <div class="sub" data-i18n="stores.add.title"></div>
        <form id="addForm" class="addRow">
          <input id="addName" data-i18n-ph="stores.add.name" required>
          <input id="addDomain" data-i18n-ph="stores.add.domain" required autocapitalize="off">
          <select id="addRegion">
            <option value="US" data-i18n="region.US"></option>
            <option value="UK" data-i18n="region.UK"></option>
            <option value="CA" data-i18n="region.CA"></option>
            <option value="EU" data-i18n="region.EU"></option>
            <option value="ETC" data-i18n="region.ETC"></option>
          </select>
          <button type="submit" data-i18n="stores.add.button"></button>
        </form>
      </div>
      <div class="panelFoot">
        <button type="button" id="resetDetect" class="link" data-i18n="stores.redetect"></button>
      </div>
      </details>

      <details class="panel" id="ratePanel">
      <summary><span class="sumTitle" data-i18n="rates.title"></span> <span id="rateInfo"></span></summary>
      <div class="rates" id="rateInputs"></div>
      <p class="hint" data-i18n="rates.hint"></p>
      </details>

      <details class="panel" id="advPanel">
      <summary><span class="sumTitle" data-i18n="adv.title"></span></summary>
      <div class="advRows">
        <label class="advRow"><input type="checkbox" id="optTabs"><span data-i18n="adv.tabs"></span></label>
      </div>
      <p class="hint" data-i18n="adv.hint"></p>
      </details>

      <details class="panel" id="notifyPanel">
      <summary><span class="sumTitle" data-i18n="nf.title"></span> <span id="notifyInfo" class="sumInfo"></span></summary>
      <div class="nf">
        <p class="hint" data-i18n="nf.intro"></p>
        <div class="nfSec">
          <div class="nfHead">✈️ <span data-i18n="nf.tg.title"></span></div>
          <div id="nfTg" class="nfBody"></div>
        </div>
        <div class="nfSec">
          <div class="nfHead">✉️ <span data-i18n="nf.mail.title"></span></div>
          <div id="nfMail" class="nfBody"></div>
        </div>
        <div class="nfBtns nfPad"><button type="button" id="nfTest" class="ghost" data-i18n="nf.test"></button></div>
        <p id="nfStatus" class="nfStatus"></p>
        <div class="sub" data-i18n="nf.listTitle"></div>
        <div id="nfList" class="nfList"></div>
        <details class="nfAdv">
          <summary data-i18n="nf.adv.title"></summary>
          <div class="nfAdvBody">
            <p class="hint" data-i18n="nf.adv.deviceHint"></p>
            <div class="nfRow"><input id="nfCode" readonly><button type="button" id="nfCodeCopy" class="ghost" data-i18n="nf.adv.copy"></button></div>
            <div class="nfRow"><input id="nfCodeIn" data-i18n-ph="nf.adv.codePh" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="nfCodeUse" class="ghost" data-i18n="nf.adv.use"></button></div>
            <p class="hint" data-i18n="nf.adv.serverHint"></p>
            <div class="nfRow"><input id="nfServer" type="text" inputmode="url" placeholder="https://…workers.dev" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="nfServerSave" class="ghost" data-i18n="nf.adv.save"></button></div>
            <button type="button" id="nfDelete" class="link danger" data-i18n="nf.adv.delete"></button>
          </div>
        </details>
      </div>
      </details>

    </div>
  </aside>

  <aside id="history" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="sheetHead">
      <h2 id="historyTitle" data-i18n="hist.title"></h2>
      <button type="button" class="sheetClose" data-i18n="settings.done"></button>
    </div>
    <div class="sheetBody">
      <p class="hint histHint" data-i18n="hist.hint"></p>
      <div id="histList" class="histList"></div>
      <p id="histEmpty" class="histEmpty" data-i18n="hist.empty" hidden></p>
      <button type="button" id="histClear" class="link danger histClear" data-i18n="hist.clear"></button>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <template id="cardTpl">
    <a class="card" target="_blank" rel="noopener noreferrer">
      <img class="thumb" alt="" loading="lazy" referrerpolicy="no-referrer">
      <div class="body">
        <div class="meta"><span class="store"></span><span class="region"></span></div>
        <div class="title"></div>
        <div class="variant"></div>
        <div class="badges"></div>
      </div>
      <div class="price">
        <div class="krw"></div>
        <div class="orig"></div>
        <div class="perml"></div>
      </div>
    </a>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
